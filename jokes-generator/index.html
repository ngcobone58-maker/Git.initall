<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NtokzaREjokes | Talking Joke Generator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'] }
        }
      }
    }
  </script>
  <style>
    .aviator.speaking .mouth {
      animation: mouthMove 160ms linear infinite;
    }
    @keyframes mouthMove {
      0% { transform: scaleY(1); }
      25% { transform: scaleY(0.55); }
      50% { transform: scaleY(1.25); }
      75% { transform: scaleY(0.7); }
      100% { transform: scaleY(1); }
    }
    .aviator.speaking {
      animation: headBob 700ms ease-in-out infinite;
    }
    @keyframes headBob {
      0% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
      100% { transform: translateY(0); }
    }
  </style>
</head>
<body class="font-sans bg-gradient-to-br from-slate-900 via-indigo-950 to-slate-900 min-h-screen text-white antialiased">

  <div class="min-h-screen flex items-center justify-center p-4 sm:p-6">
    <div class="w-full max-w-3xl bg-white/5 backdrop-blur-xl border border-white/10 rounded-3xl shadow-2xl overflow-hidden">
      
      <!-- Header -->
      <div class="px-6 sm:px-8 pt-7 pb-5 border-b border-white/10">
        <div class="flex items-center justify-between">
          <div>
            <h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight">
              Ntokza<span class="text-yellow-400">RE</span>jokes
            </h1>
            <p class="text-sm text-white/60 mt-1">Talking Aviator • Random Joke Generator</p>
          </div>
          <div class="hidden sm:flex items-center gap-2 text-xs text-white/50">
            <span class="w-2 h-2 bg-green-400 rounded-full animate-pulse"></span>
            Live
          </div>
        </div>
      </div>

      <!-- Main Content -->
      <div class="p-6 sm:p-8">
        <div class="grid md:grid-cols-[220px_1fr] gap-8 items-start">
          
          <!-- Aviator -->
          <div class="flex flex-col items-center">
            <div id="aviator" class="aviator w-48 h-48 sm:w-52 sm:h-52 rounded-2xl bg-gradient-to-br from-blue-500 to-indigo-700 flex items-center justify-center cursor-pointer shadow-lg hover:scale-105 transition-transform duration-200 select-none" role="button" tabindex="0">
              <div class="relative flex flex-col items-center">
                <!-- Head -->
                <div class="w-28 h-28 bg-amber-200 rounded-full relative flex flex-col items-center justify-center shadow-inner">
                  <!-- Goggles -->
                  <div class="flex justify-between w-[90%] px-1">
                    <div class="w-10 h-7 bg-gray-800 rounded-md border-4 border-gray-300 flex items-center justify-center overflow-hidden">
                      <div class="w-7 h-4 bg-blue-100 rounded-sm"></div>
                    </div>
                    <div class="w-10 h-7 bg-gray-800 rounded-md border-4 border-gray-300 flex items-center justify-center overflow-hidden">
                      <div class="w-7 h-4 bg-blue-100 rounded-sm"></div>
                    </div>
                  </div>
                  <!-- Mouth -->
                  <div class="mouth w-11 h-4 bg-gray-800 rounded-full mt-3 origin-center"></div>
                </div>
                <!-- Scarf -->
                <div class="w-20 h-3.5 bg-orange-600 rounded-md mt-1 shadow"></div>
              </div>
            </div>
            <p class="text-xs text-white/50 mt-4 text-center">Click the aviator to hear the joke</p>
          </div>

          <!-- Joke Area -->
          <div class="flex flex-col h-full">
            <div class="flex flex-wrap gap-3 mb-5">
              <button id="getJokeBtn" class="px-5 py-2.5 bg-yellow-400 hover:bg-yellow-300 text-gray-900 font-semibold rounded-xl transition shadow-md">
                Get New Joke
              </button>
              <button id="speakBtn" class="px-5 py-2.5 bg-white/10 hover:bg-white/15 border border-white/15 text-white font-medium rounded-xl transition">
                Repeat Last Joke
              </button>
              <label class="flex items-center gap-2 ml-auto text-sm text-white/70 cursor-pointer">
                <input type="checkbox" id="autoSpeak" checked class="w-4 h-4 rounded accent-yellow-400">
                Auto-speak
              </label>
            </div>

            <div class="flex-1 bg-white/5 border border-white/10 rounded-2xl p-5 min-h-[160px]">
              <div id="jokeSetup" class="text-lg text-white/90 mb-3 leading-relaxed">Loading a joke...</div>
              <div id="jokePunchline" class="text-xl font-bold text-yellow-300 mb-4"></div>
              <div id="status" class="text-xs text-white/40">Status: idle</div>
            </div>

            <p class="text-xs text-white/30 mt-4">Powered by Official Joke API + Browser Speech</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const JOKE_API = 'https://official-joke-api.appspot.com/random_joke';
    const aviatorEl = document.getElementById('aviator');
    const getJokeBtn = document.getElementById('getJokeBtn');
    const speakBtn = document.getElementById('speakBtn');
    const autoSpeakChk = document.getElementById('autoSpeak');
    const jokeSetupEl = document.getElementById('jokeSetup');
    const jokePunchlineEl = document.getElementById('jokePunchline');
    const statusEl = document.getElementById('status');

    let lastJoke = null;

    function setStatus(text) {
      statusEl.textContent = 'Status: ' + text;
    }

    function setSpeaking(on) {
      aviatorEl.classList.toggle('speaking', !!on);
    }

    async function fetchJoke() {
      setStatus('fetching joke...');
      jokeSetupEl.textContent = 'Loading joke...';
      jokePunchlineEl.textContent = '';
      try {
        const res = await fetch(JOKE_API, { cache: 'no-store' });
        if (!res.ok) throw new Error('Network error');
        const data = await res.json();
        lastJoke = data;
        jokeSetupEl.textContent = data.setup || '';
        jokePunchlineEl.textContent = data.punchline || '';
        setStatus('joke loaded');
        if (autoSpeakChk.checked) {
          speakJoke(data.setup, data.punchline);
        }
      } catch (err) {
        console.error(err);
        jokeSetupEl.textContent = "Oops — couldn't load a joke.";
        jokePunchlineEl.textContent = '';
        setStatus('error');
      }
    }

    function speakJoke(setup, punchline) {
      if (!('speechSynthesis' in window)) {
        setStatus('speech not supported');
        return;
      }
      window.speechSynthesis.cancel();
      setStatus('speaking...');

      const u1 = new SpeechSynthesisUtterance(setup || '');
      const u2 = new SpeechSynthesisUtterance(punchline || '');

      const voices = window.speechSynthesis.getVoices();
      if (voices.length) {
        const en = voices.find(v => /en/i.test(v.lang)) || voices[0];
        if (en) { u1.voice = en; u2.voice = en; }
      }

      u1.rate = 0.97;
      u2.rate = 0.97;

      u1.onstart = () => setSpeaking(true);
      u1.onend = () => {
        setTimeout(() => window.speechSynthesis.speak(u2), 400);
      };
      u2.onend = () => {
        setSpeaking(false);
        setTimeout(() => setStatus('idle'), 300);
      };

      window.speechSynthesis.speak(u1);
    }

    function repeatOrFetch() {
      if (lastJoke) {
        speakJoke(lastJoke.setup, lastJoke.punchline);
      } else {
        fetchJoke();
      }
    }

    getJokeBtn.addEventListener('click', fetchJoke);
    speakBtn.addEventListener('click', repeatOrFetch);
    aviatorEl.addEventListener('click', repeatOrFetch);
    aviatorEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        repeatOrFetch();
      }
    });

    if ('speechSynthesis' in window) {
      window.speechSynthesis.getVoices();
      window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
    }

    fetchJoke();
  </script>
</body>
</html>
